<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro - Nexus SAC B2B</title>
  <meta name="description" content="Portal de inicio de sesión corporativo para el sistema de cotizaciones y tarifas de Nexus SAC.">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(30, 58, 138, 0.25), transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.15), transparent 50%),
                  #0b0f19;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .demo-account-pill {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.6rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s ease;
    }
    .demo-account-pill:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div class="brand-logo-icon" style="margin: 0 auto 1rem auto; width: 56px; height: 56px; font-size: 1.6rem;">
      NX
    </div>
    <h1 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;">Nexus SAC</h1>
    <p style="font-size: 0.82rem; color: var(--text-dim); margin-top: 0.25rem;">
      Sistema Centralizado de Cotizaciones y Tarifas
    </p>
  </div>

  <form id="form-login">
    <div class="form-group">
      <label class="form-label" for="login-email">Correo Corporativo *</label>
      <input type="email" class="form-input" id="login-email" placeholder="usuario@nexussac.pe" required />
    </div>

    <div class="form-group">
      <label class="form-label" for="login-password">Contraseña *</label>
      <input type="password" class="form-input" id="login-password" value="••••••••" required />
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.8rem; color: var(--text-dim);">
      <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
        <input type="checkbox" checked /> Recordar sesión
      </label>
      <span style="color: #60a5fa; cursor: pointer;">Modo Seguro SSL</span>
    </div>

    <div id="login-error-msg" style="display: none; padding: 0.65rem 0.85rem; border-radius: var(--radius-md); background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); color: #f87171; font-size: 0.82rem; margin-bottom: 1rem;"></div>

    <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%;">
      Iniciar Sesión
    </button>
  </form>

  <!-- Selección de cuentas corporativas por rol -->
  <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
    <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-dim); font-weight: 700; margin-bottom: 0.75rem;">
      Seleccionar Cuenta / Rol de Acceso
    </div>

    <div class="demo-account-pill" onclick="quickLogin('vendedor@nexussac.pe')">
      <div>
        <strong style="color: var(--text-main);">Carlos Mendoza</strong>
        <div style="font-size: 0.72rem; color: var(--text-dim);">vendedor@nexussac.pe</div>
      </div>
      <span class="user-role-badge role-vendedor">Vendedor</span>
    </div>

    <div class="demo-account-pill" onclick="quickLogin('supervisor@nexussac.pe')">
      <div>
        <strong style="color: var(--text-main);">Elena Ramos</strong>
        <div style="font-size: 0.72rem; color: var(--text-dim);">supervisor@nexussac.pe</div>
      </div>
      <span class="user-role-badge role-supervisor">Supervisor</span>
    </div>

    <div class="demo-account-pill" onclick="quickLogin('admin@nexussac.pe')">
      <div>
        <strong style="color: var(--text-main);">Administrador Nexus</strong>
        <div style="font-size: 0.72rem; color: var(--text-dim);">admin@nexussac.pe</div>
      </div>
      <span class="user-role-badge role-administrador">Admin</span>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  async function performLogin(email, password = '••••••••') {
    const errorBox = document.getElementById('login-error-msg');
    const submitBtn = document.getElementById('btn-login-submit');
    if (errorBox) errorBox.style.display = 'none';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando acceso...';
    }

    try {
      const res = await API.login(email, password);
      if (res.success && res.user) {
        Auth.setCurrentUser(res.user);
        window.location.href = 'index.html';
      } else {
        throw new Error(res.message || 'No fue posible iniciar sesión.');
      }
    } catch (err) {
      if (errorBox) {
        errorBox.textContent = '❌ ' + (err.message || 'Error en inicio de sesión');
        errorBox.style.display = 'block';
      } else {
        alert('Error en inicio de sesión: ' + err.message);
      }
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar Sesión';
      }
    }
  }

  function quickLogin(email) {
    document.getElementById('login-email').value = email;
    performLogin(email, '••••••••');
  }

  document.getElementById('form-login').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    performLogin(email, password);
  });
</script>

</body>
</html>
