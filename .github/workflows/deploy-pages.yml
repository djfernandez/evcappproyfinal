name: Deploy Nexus SAC Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Establece los permisos necesarios para el despliegue en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola ejecución concurrente de despliegue
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configurar conexión pública de Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configura SUPABASE_URL (Actions variable) y SUPABASE_ANON_KEY (Actions secret)."
            exit 1
          fi
          node -e "const fs = require('fs'); const config = { url: process.env.SUPABASE_URL, anonKey: process.env.SUPABASE_ANON_KEY }; fs.writeFileSync('frontend/public/js/supabase-config.js', 'window.NEXUS_SUPABASE_CONFIG = ' + JSON.stringify(config) + ';\\n');"

      - name: Subir artefactos estáticos (frontend/public)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/public'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
